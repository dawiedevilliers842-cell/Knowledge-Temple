<div #scene id="scene" class="about-me-container">
  <div data-depth="0.1">
  </div>

  <div #aboutMe class="content-layer" data-depth="0.0">
    <mat-card #aboutMeCard class="page-card">
      <mat-card-header>
        <mat-card-title>About Me</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <p>
          My name is Dawie de Villiers
          I am a full-time adrenaline junky who likes to code, make music and build Legos 🧱
        </p>
      </mat-card-content>
    </mat-card>
    <div class="white-space"></div>
  </div>



  <div #image class="image-layer" data-depth="0.3">
    <img src="images/climb_18.JPG" alt="climb">
  </div>


  @for (technology of technologies(); track technology.name) {
  <div [attr.data-depth]="technology.depth" class="tech-icon-container">
    <a [href]="technology.url" target="_blank" class="icon-widget-container" rel="noopener noreferrer"
      [style.top.px]="technology.coordinates.top" [style.left.px]="technology.coordinates.left">
      <img class="tech-icon" [src]="technology.image" [alt]="technology.name">
    </a>
  </div>
  }
</div>
